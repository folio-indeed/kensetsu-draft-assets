<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>建設ドラフト ガチャ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0c0814;font-family:-apple-system,'Hiragino Sans',sans-serif}
#stage{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;perspective:900px}
#rays{position:absolute;inset:-60%;background:repeating-conic-gradient(from 0deg,rgba(255,215,80,.10) 0deg 5deg,transparent 5deg 10deg);animation:spin 22s linear infinite;opacity:.7}
@keyframes spin{to{transform:rotate(360deg)}}
#aura{position:absolute;inset:0;z-index:1;opacity:0;transition:opacity .35s,background .18s;pointer-events:none}
#pack{position:relative;width:min(62vw,290px);z-index:2;filter:drop-shadow(0 0 26px rgba(255,215,80,.5));animation:float 2.4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
#tap{margin-top:26px;color:#ffd94e;font-size:21px;font-weight:800;z-index:2;animation:pulse 1.1s ease-in-out infinite;text-shadow:0 2px 8px #000}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.93)}}
.shake1{animation:sh .10s linear infinite !important}
.shake2{animation:sh .05s linear infinite !important}
@keyframes sh{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(-8px,4px) rotate(-2.6deg)}50%{transform:translate(7px,-5px) rotate(2.2deg)}75%{transform:translate(-5px,-6px) rotate(-1.8deg)}100%{transform:translate(6px,5px) rotate(2.4deg)}}
#flash{position:fixed;inset:0;background:#fff;opacity:0;z-index:8;pointer-events:none}
#cardwrap{position:absolute;z-index:4;width:min(84vw,420px);aspect-ratio:1;transform-style:preserve-3d;opacity:0}
#cardwrap.in{opacity:1;animation:dropin .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes dropin{from{transform:translateY(-60vh) rotate(9deg)}to{transform:translateY(0) rotate(0)}}
#cardwrap.spin{animation:spin3d .8s ease-in-out}
@keyframes spin3d{from{transform:rotateY(0)}to{transform:rotateY(720deg)}}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;width:100%}
#back2{transform:rotateY(0)}
#front{transform:rotateY(180deg)}
#cardwrap.flip #back2{transform:rotateY(180deg);transition:transform .5s}
#cardwrap.flip #front{transform:rotateY(360deg);transition:transform .5s}
#cardwrap.flip{filter:drop-shadow(0 0 50px var(--rc,#ffd94e))}
#rar{position:absolute;top:7%;z-index:6;font-size:17vw;font-weight:900;color:#fff;opacity:0;text-shadow:0 0 34px currentColor,0 4px 0 #000}
#rar.show{animation:rin .45s cubic-bezier(.2,1.9,.4,1) forwards}
@keyframes rin{from{opacity:0;transform:scale(3.4)}to{opacity:1;transform:scale(1)}}
#getb{position:absolute;bottom:96px;z-index:7;font-size:9vw;font-weight:900;color:#ffd94e;opacity:0;text-shadow:0 0 20px #000,0 3px 0 #000;letter-spacing:.1em}
#getb.show{animation:rin .4s .15s cubic-bezier(.2,1.9,.4,1) forwards}
#fx{position:fixed;inset:0;z-index:5;pointer-events:none}
#back{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);z-index:9;display:none;background:linear-gradient(180deg,#ffe98a,#ffc31e);color:#201400;font-weight:900;font-size:18px;border:none;border-radius:30px;padding:15px 40px;box-shadow:0 4px 18px rgba(0,0,0,.6)}
body.quake{animation:qk .5s linear}
@keyframes qk{0%,100%{transform:translate(0,0)}20%{transform:translate(-9px,6px)}40%{transform:translate(8px,-7px)}60%{transform:translate(-7px,-5px)}80%{transform:translate(6px,7px)}}
</style></head>
<body>
<div id="stage">
  <div id="rays"></div>
  <div id="aura"></div>
  <img id="pack" src="../gacha_cards/pack.png" alt="">
  <div id="tap">▼ タップして開封 ▼</div>
  <div id="rar"></div>
  <div id="cardwrap">
    <img class="face" id="back2" src="../gacha_cards/back.png" alt="">
    <img class="face" id="front" src="" alt="">
  </div>
  <div id="getb">GET!!</div>
  <canvas id="fx"></canvas>
  <button id="back" onclick="closeMe()">受け取る ▶</button>
</div>
<div id="flash"></div>
<script>
const P=new URLSearchParams(location.search);
const t=P.get('t')||'n_ticket2';
const RAR = t.startsWith('ssr')?'SSR':t.startsWith('sr')?'SR':t.startsWith('r_')?'R':'N';
// 昇格ラダー: 実レア度までオーラの色が階段で上がる（人気ガチャの文法）
const COLORS={blue:'#4d9dff',red:'#ff5d5d',gold:'#ffd94e',rainbow:'RAINBOW'};
const LADDER={N:['blue'],R:['blue','red'],SR:['blue','red','gold'],SSR:['blue','red','gold','rainbow']}[RAR];
const RC={N:'#4d9dff',R:'#ff5d5d',SR:'#ffd94e',SSR:'#ff5df0'}[RAR];
const CONF={N:50,R:110,SR:190,SSR:320}[RAR];
const front=document.getElementById('front'); front.src='../gacha_cards/'+t+'.png';
const pack=document.getElementById('pack'),tap=document.getElementById('tap'),
aura=document.getElementById('aura'),flash=document.getElementById('flash'),
rar=document.getElementById('rar'),getb=document.getElementById('getb'),
wrap=document.getElementById('cardwrap'),back=document.getElementById('back');
document.documentElement.style.setProperty('--rc',RC);
let AC=null;
function tone(f,dur,when,type='square',vol=.12){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,AC.currentTime+when);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+when+dur);o.connect(g).connect(AC.destination);o.start(AC.currentTime+when);o.stop(AC.currentTime+when+dur+.05)}
function sweep(f0,f1,dur,when,vol=.25){const o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.setValueAtTime(f0,AC.currentTime+when);o.frequency.exponentialRampToValueAtTime(f1,AC.currentTime+when+dur);g.gain.setValueAtTime(vol,AC.currentTime+when);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+when+dur+.1);o.connect(g).connect(AC.destination);o.start(AC.currentTime+when);o.stop(AC.currentTime+when+dur+.15)}
function drum(ms){const n=Math.floor(ms/85);for(let i=0;i<n;i++)tone(105+Math.random()*45,.055,i*.085,'square',.10)}
function fanfare(){const seq=RAR==='SSR'?[523,659,784,1047,1319,1568,2093]:RAR==='SR'?[523,659,784,1047,1319]:[523,659,784];seq.forEach((f,i)=>{tone(f,.30,i*.12,'triangle',.22);tone(f/2,.30,i*.12,'sine',.12)})}
const cv=document.getElementById('fx'),cx2=cv.getContext('2d');let parts=[];
function boom(n,gold){cv.width=innerWidth;cv.height=innerHeight;
 const cols=RAR==='SSR'?['#ff5df0','#5da8ff','#5dff8f','#ffd94e','#ff5d5d','#fff']:gold?['#ffd94e','#ffe98a','#fff']:[RC,'#ffd94e','#fff'];
 for(let i=0;i<n;i++)parts.push({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*17,vy:-Math.random()*16-4,g:.36,s:4+Math.random()*8,c:cols[i%cols.length],r:Math.random()*6.28,vr:(Math.random()-.5)*.45,life:120+Math.random()*70});
 if(!boom.running){boom.running=true;loop()}}
function loop(){cx2.clearRect(0,0,cv.width,cv.height);parts=parts.filter(p=>p.life-->0);
 for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.r+=p.vr;cx2.save();cx2.translate(p.x,p.y);cx2.rotate(p.r);cx2.fillStyle=p.c;cx2.fillRect(-p.s/2,-p.s/2,p.s,p.s*1.6);cx2.restore()}
 if(parts.length)requestAnimationFrame(loop);else boom.running=false}
function setAura(c){if(c==='RAINBOW')return; aura.style.background='radial-gradient(circle at 50% 45%, '+c+'66 0%, transparent 62%)';aura.style.opacity=1}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
let opened=false;
document.getElementById('stage').addEventListener('click',()=>{
 if(opened)return;opened=true;
 AC=new (window.AudioContext||window.webkitAudioContext)();
 tap.style.display='none';
 pack.classList.add('shake1');
 // Act1: 昇格ラダー
 const stepMs=RAR==='N'?900:1000;
 drum(LADDER.length*stepMs+400);
 LADDER.forEach((c,i)=>{
   setTimeout(()=>{
     if(c==='rainbow'){ // 虹昇格=キュイン+ストロボ
       sweep(400,1800,.5,0,.3); vib([60,40,60,40,120]);
       let k=0;const cols=['#ff5df0','#5da8ff','#5dff8f','#ffd94e'];
       const iv=setInterval(()=>setAura(cols[k++%4]),110);
       setTimeout(()=>clearInterval(iv),stepMs+300);
     } else {
       setAura(COLORS[c]); tone(520+i*180,.18,0,'triangle',.2); vib(40);
       if(i===LADDER.length-1&&RAR!=='N') sweep(300,900,.3,0,.18);
     }
     if(i===LADDER.length-1) pack.classList.replace('shake1','shake2');
   }, i*stepMs+300);
 });
 setTimeout(explode, LADDER.length*stepMs+700);
});
function explode(){
 flash.style.transition='none';flash.style.opacity=1;
 sweep(1400,200,.4,0,.28); vib(RAR==='SSR'?[80,50,80,50,200]:[120]);
 document.body.classList.add('quake');
 setTimeout(()=>{
  pack.style.display='none';
  flash.style.transition='opacity .45s';flash.style.opacity=0;
  // Act2: 裏面カード降臨→回転
  wrap.classList.add('in');
  tone(200,.3,0,'sine',.2);
  setTimeout(()=>{wrap.classList.add('spin')},550);
  // Act3: レア度スタンプ
  setTimeout(()=>{rar.textContent=RAR;rar.style.color=RC;rar.classList.add('show');tone(880,.25,0,'triangle',.25)},1350);
  // Act4: フリップ=賞品公開
  setTimeout(()=>{
   wrap.classList.add('flip');
   boom(CONF); fanfare(); vib([60,40,60,40,60]);
   getb.classList.add('show');
   if(RAR==='SSR'){setTimeout(()=>boom(200,true),650);setTimeout(()=>boom(150,true),1300)}
   if(RAR==='SR'){setTimeout(()=>boom(120,true),650)}
   setTimeout(()=>{back.style.display='block'},1000);
  },2050);
 },260)}
function closeMe(){try{if(window.liff&&liff.isInClient()){liff.closeWindow();return}}catch(e){}
 window.close();history.back()}
</script>
</body></html>
