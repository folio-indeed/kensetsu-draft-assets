<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>建設ドラフト</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#160a02;font-family:-apple-system,'Hiragino Sans',sans-serif}
.card{margin:20px;max-width:340px;background:linear-gradient(180deg,#2a1608,#1a0c04);border:3px solid #f5c542;border-radius:20px;padding:32px 26px;text-align:center}
.t{font-size:22px;font-weight:900;color:#ffd94e;margin-bottom:14px}
.b{font-size:15px;color:#fff;line-height:1.9}
.s{font-size:12px;color:#c9b06a;margin-top:18px}
</style></head>
<body><div class="card">
<div class="t">🎰 このガチャは<br>開封済みです</div>
<div class="b">結果はLINEのトークに<br>届いています📨</div>
<div class="s">左上の「×」か「完了」で<br>トークにもどってください</div>
</div></body></html>
