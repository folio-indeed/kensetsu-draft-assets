<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>建設ドラフト ガチャ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden;background:#05030c;font-family:-apple-system,'Hiragino Sans',sans-serif}
canvas{position:fixed;inset:0;display:block}
#ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;pointer-events:none;z-index:10}
#result{width:100%;max-width:430px;margin:0 12px 14px;background:linear-gradient(180deg,rgba(20,14,4,.96),rgba(10,7,2,.96));border:2px solid #ffd94e;border-radius:18px;padding:16px 18px;opacity:0;transform:translateY(40px);transition:all .45s cubic-bezier(.2,1.4,.4,1);pointer-events:auto}
#result.show{opacity:1;transform:translateY(0)}
#rlabel{font-size:13px;font-weight:800;color:#c9b06a;letter-spacing:.2em}
#rprize{font-size:26px;font-weight:900;color:#ffd94e;margin:6px 0 4px;text-shadow:0 0 14px rgba(255,217,78,.5)}
#rhow{font-size:14px;color:#fff;line-height:1.55}
#rtk{font-size:13px;color:#c9b06a;margin-top:8px}
#btn{margin-top:12px;width:100%;background:linear-gradient(180deg,#ffe98a,#ffc31e);color:#231600;font-weight:900;font-size:17px;border:none;border-radius:26px;padding:14px;box-shadow:0 4px 16px rgba(0,0,0,.5)}
</style></head>
<body>
<canvas id="cv"></canvas>
<div id="ui"><div id="result">
  <div id="rlabel"></div><div id="rprize"></div><div id="rhow"></div><div id="rtk"></div>
  <button id="btn" onclick="closeMe()">受け取る ▶</button>
</div></div>
<script>
/* ============ 建設ドラフト ガチャ演出エンジン v3（全Canvas・加算合成） ============ */
const P=new URLSearchParams(location.search);
const t=P.get('t')||'n_ticket2';
const TK=P.get('tk')||'';
const PRIZES={
 n_ticket2:{rar:'N', label:'ドラフト券 +2枚', how:'毎週金曜の抽選口数が増えました。何もしなくても自動でエントリーされます。'},
 n_ticket3:{rar:'N', label:'ドラフト券 +3枚', how:'毎週金曜の抽選口数が増えました。何もしなくても自動でエントリーされます。'},
 r_ticket5:{rar:'R', label:'ドラフト券 +5枚', how:'毎週金曜の抽選口数がドンと増えました。自動でエントリーされます。'},
 sr_redbull:{rar:'SR', label:'レッドブル 1本', how:'現場スタッフに この画面を見せると その場で受け取れます。（いない場合は後日ご案内）'},
 ssr_pp500:{rar:'SSR', label:'PayPayポイント 500円', how:'ギフトコードがLINEのトークに届きます（当日中）。'},
 ssr_pp1000:{rar:'SSR', label:'PayPayポイント 1,000円', how:'ギフトコードがLINEのトークに届きます（当日中）。'},
};
const PR=PRIZES[t]||PRIZES.n_ticket2, RAR=PR.rar;
const RARCOL={N:'#57a8ff',R:'#ff5d5d',SR:'#ffd94e',SSR:'#ff5df0'}[RAR];
const LADDER={N:['#57a8ff'],R:['#57a8ff','#ff5d5d'],SR:['#57a8ff','#ff5d5d','#ffd94e'],SSR:['#57a8ff','#ff5d5d','#ffd94e','RAINBOW']}[RAR];

const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
resize();addEventListener('resize',resize);
const CX=()=>W/2, CY=()=>H*0.44;

// ---- assets ----
const packImg=new Image();packImg.src='../gacha_cards/pack.png';
const backImg=new Image();backImg.src='../gacha_cards/back.png';
const cardImg=new Image();cardImg.src='../gacha_cards/'+t+'.png';

// ---- audio (リッチ合成) ----
let AC=null,master;
function ainit(){AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.9;master.connect(AC.destination)}
function noiseBuf(){const b=AC.createBuffer(1,AC.sampleRate*1.2,AC.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b}
function rumble(dur){const s=AC.createBufferSource();s.buffer=noiseBuf();s.loop=true;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=120;const g=AC.createGain();g.gain.setValueAtTime(.0001,AC.currentTime);g.gain.linearRampToValueAtTime(.5,AC.currentTime+dur*.7);g.gain.linearRampToValueAtTime(.0001,AC.currentTime+dur);s.connect(f).connect(g).connect(master);s.start();s.stop(AC.currentTime+dur+.1)}
function riser(dur){const o=AC.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(80,AC.currentTime);o.frequency.exponentialRampToValueAtTime(900,AC.currentTime+dur);const f=AC.createBiquadFilter();f.type='bandpass';f.Q.value=6;f.frequency.setValueAtTime(200,AC.currentTime);f.frequency.exponentialRampToValueAtTime(2400,AC.currentTime+dur);const g=AC.createGain();g.gain.setValueAtTime(.03,AC.currentTime);g.gain.linearRampToValueAtTime(.22,AC.currentTime+dur);g.gain.linearRampToValueAtTime(.001,AC.currentTime+dur+.05);o.connect(f).connect(g).connect(master);o.start();o.stop(AC.currentTime+dur+.1)}
function impact(){const s=AC.createBufferSource();s.buffer=noiseBuf();const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(3000,AC.currentTime);f.frequency.exponentialRampToValueAtTime(80,AC.currentTime+.5);const g=AC.createGain();g.gain.setValueAtTime(.7,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.6);s.connect(f).connect(g).connect(master);s.start();s.stop(AC.currentTime+.7);
 const o=AC.createOscillator();o.type='sine';o.frequency.setValueAtTime(160,AC.currentTime);o.frequency.exponentialRampToValueAtTime(40,AC.currentTime+.5);const g2=AC.createGain();g2.gain.setValueAtTime(.6,AC.currentTime);g2.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.55);o.connect(g2).connect(master);o.start();o.stop(AC.currentTime+.6)}
function kuin(){[0,.06].forEach(dt=>{const o=AC.createOscillator();o.type='square';o.frequency.setValueAtTime(500,AC.currentTime+dt);o.frequency.exponentialRampToValueAtTime(2400,AC.currentTime+dt+.45);const g=AC.createGain();g.gain.setValueAtTime(.16,AC.currentTime+dt);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dt+.6);o.connect(g).connect(master);o.start(AC.currentTime+dt);o.stop(AC.currentTime+dt+.7)})}
function stab(f,when,dur=.34,vol=.2){[f,f*1.26,f*1.5].forEach(fr=>{const o=AC.createOscillator();o.type='triangle';o.frequency.value=fr;const g=AC.createGain();g.gain.setValueAtTime(vol,AC.currentTime+when);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+when+dur);o.connect(g).connect(master);o.start(AC.currentTime+when);o.stop(AC.currentTime+when+dur+.05)})}
function fanfare(){const seq=RAR==='SSR'?[523,659,784,1047,1319]:RAR==='SR'?[523,659,784,1047]:[523,784];seq.forEach((f,i)=>stab(f,i*.14));stab(seq[seq.length-1]*2,seq.length*.14,.7,.16)}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

// ---- particle system (加算合成) ----
let parts=[],rings=[],beams=[],shards=[],sparksBG=[];
function addP(o){parts.push(Object.assign({x:0,y:0,vx:0,vy:0,g:0,drag:1,s:3,c:'#fff',life:60,max:60,glow:12,shape:'dot'},o))}
function ring(x,y,c,sp=9,w=5){rings.push({x,y,r:10,sp,w,c,a:1})}
function godrays(n,c){for(let i=0;i<n;i++)beams.push({a:Math.random()*6.28,w:.05+Math.random()*.12,c,life:70+Math.random()*50,max:120,rot:(Math.random()-.5)*.01})}
for(let i=0;i<70;i++)sparksBG.push({x:Math.random(),y:Math.random(),s:.5+Math.random()*1.6,tw:Math.random()*6.28})

// ---- scene state ----
let scene='idle';           // idle→charge→burst→descend→stamp→reveal→result
let t0=performance.now(), sceneT=0, ladderIdx=-1, packScale=1, packShake=0, packGlow=0;
let cardY=-600, cardRot=0, cardFlip=0, stampA=0, whiteout=0, quake=0, aura={c:'#000',a:0}, rainbowPhase=0;
let glossX=-1;
const rand=(a,b)=>a+Math.random()*(b-a);

function sceneSet(s){scene=s;sceneT=0}
function chargeStart(){
 ainit();sceneSet('charge');
 const step=RAR==='N'?900:1050, total=LADDER.length*step+500;
 rumble(total/1000+.4); riser(total/1000);
 LADDER.forEach((c,i)=>setTimeout(()=>{
   ladderIdx=i;
   if(c==='RAINBOW'){kuin();vib([70,40,70,40,150]);godrays(10,'#fff')}
   else{stab(400+i*160,0,.2,.12);vib(45)}
   ring(CX(),CY(),c==='RAINBOW'?'#fff':c,11,6);
 }, 400+i*step));
 setTimeout(()=>{sceneSet('burst');burstFx()}, 400+total);
}
function burstFx(){
 impact();vib(RAR==='SSR'?[90,40,90,40,220]:[140]);
 whiteout=1;quake=RAR==='SSR'?26:16;
 // パック破砕: 三角シャード
 for(let i=0;i<26;i++){const a=Math.random()*6.28,v=rand(6,17);
  shards.push({x:CX(),y:CY(),vx:Math.cos(a)*v,vy:Math.sin(a)*v-4,r:Math.random()*6.28,vr:rand(-.3,.3),s:rand(14,46),life:80,c:['#2a1c56','#ffd94e','#3b2a6e'][i%3]})}
 for(let i=0;i<160;i++){const a=Math.random()*6.28,v=rand(2,15);
  addP({x:CX(),y:CY(),vx:Math.cos(a)*v,vy:Math.sin(a)*v,drag:.97,s:rand(1.5,4),c:['#fff','#ffd94e',RARCOL][i%3],life:rand(40,90),glow:18})}
 godrays(RAR==='SSR'?22:12, RAR==='SSR'?null:RARCOL);
 setTimeout(()=>sceneSet('descend'), 500);
 setTimeout(()=>{sceneSet('stamp');stampA=0;impact();stab(880,0,.3,.22);vib(80);ring(CX(),CY()-H*0.18,RARCOL,13,8)}, 1600);
 setTimeout(()=>{revealFx()}, 2450);
}
function revealFx(){
 sceneSet('reveal');fanfare();vib([60,40,60,40,80]);
 confetti(RAR==='SSR'?300:RAR==='SR'?180:100);
 if(RAR==='SSR'){setTimeout(()=>confetti(200,true),700);setTimeout(()=>confetti(160,true),1400)}
 if(RAR==='SR')setTimeout(()=>confetti(120,true),700);
 glossX=-0.4;
 setTimeout(()=>{sceneSet('result');showResult()}, 1500);
}
function confetti(n,gold){
 const cols=RAR==='SSR'?['#ff5df0','#5da8ff','#5dff8f','#ffd94e','#ff5d5d','#fff']:gold?['#ffd94e','#ffe98a','#fff']:[RARCOL,'#ffd94e','#fff'];
 for(let i=0;i<n;i++)addP({x:CX(),y:CY(),vx:rand(-9,9),vy:rand(-16,-4),g:.32,drag:.99,s:rand(3.5,8),c:cols[i%cols.length],life:rand(90,180),glow:0,shape:'rect',r:Math.random()*6.28,vr:rand(-.3,.3)});
}
function showResult(){
 const r=document.getElementById('result');
 document.getElementById('rlabel').textContent='【'+RAR+'】獲得';
 document.getElementById('rlabel').style.color=RARCOL;
 document.getElementById('rprize').textContent=PR.label;
 document.getElementById('rhow').textContent=PR.how;
 document.getElementById('rtk').textContent=TK?('現在のドラフト券: '+TK+'枚（毎週金曜 自動抽選）'):'';
 r.classList.add('show');
}
addEventListener('pointerdown',()=>{if(scene==='idle')chargeStart()});

// ---- render loop ----
function draw(now){
 const dt=Math.min(32,now-t0);t0=now;sceneT+=dt;rainbowPhase+=dt*.004;
 ctx.clearRect(0,0,W,H);
 // 背景
 const bgGrad=ctx.createRadialGradient(CX(),CY(),0,CX(),CY(),Math.max(W,H)*.8);
 bgGrad.addColorStop(0,'#181030');bgGrad.addColorStop(1,'#05030c');
 ctx.fillStyle=bgGrad;ctx.fillRect(0,0,W,H);
 // 星
 ctx.save();ctx.globalCompositeOperation='lighter';
 for(const s of sparksBG){s.tw+=dt*.003;ctx.globalAlpha=.25+.25*Math.sin(s.tw);ctx.fillStyle='#cbd6ff';ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.s,0,7);ctx.fill()}
 ctx.restore();
 // クエイク
 let qx=0,qy=0;
 if(quake>0){qx=rand(-quake,quake);qy=rand(-quake,quake);quake*=.88;if(quake<.5)quake=0}
 ctx.save();ctx.translate(qx,qy);
 // オーラ
 if(scene==='charge'&&ladderIdx>=0){
  const c=LADDER[ladderIdx];
  let col=c==='RAINBOW'?`hsl(${(rainbowPhase*260)%360},95%,62%)`:c;
  const g=ctx.createRadialGradient(CX(),CY(),0,CX(),CY(),H*.5);
  g.addColorStop(0,col+'');g.addColorStop(1,'transparent');
  ctx.save();ctx.globalAlpha=.4+.15*Math.sin(sceneT*.02);ctx.globalCompositeOperation='lighter';ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.restore();
 }
 // godrays
 ctx.save();ctx.globalCompositeOperation='lighter';
 beams=beams.filter(b=>b.life-->0);
 for(const b of beams){b.a+=b.rot;const al=(b.life/b.max)*.5;
  let col=b.c||`hsl(${(rainbowPhase*300+b.a*57)%360},95%,60%)`;
  ctx.save();ctx.translate(CX(),CY());ctx.rotate(b.a);ctx.globalAlpha=al;
  const gr=ctx.createLinearGradient(0,0,Math.max(W,H),0);gr.addColorStop(0,col);gr.addColorStop(1,'transparent');
  ctx.fillStyle=gr;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.max(W,H),-Math.max(W,H)*b.w);ctx.lineTo(Math.max(W,H),Math.max(W,H)*b.w);ctx.closePath();ctx.fill();ctx.restore()}
 ctx.restore();
 // パック
 if(scene==='idle'||scene==='charge'){
  const breathe=1+.02*Math.sin(sceneT*.003);
  packScale=scene==='charge'?1+.06*Math.sin(sceneT*.05):breathe;
  packShake=scene==='charge'?(ladderIdx+1)*1.6:0;
  const pw=Math.min(W*.58,270),ph=pw*1.375;
  packGlow=scene==='charge'?12+ladderIdx*10:10+4*Math.sin(sceneT*.003);
  ctx.save();ctx.translate(CX()+rand(-packShake,packShake),CY()+rand(-packShake,packShake));
  ctx.shadowColor=ladderIdx>=0?(LADDER[ladderIdx]==='RAINBOW'?`hsl(${(rainbowPhase*260)%360},95%,60%)`:LADDER[ladderIdx]):'#ffd94e';
  ctx.shadowBlur=packGlow*3;
  ctx.scale(packScale,packScale);
  if(packImg.complete)ctx.drawImage(packImg,-pw/2,-ph/2,pw,ph);
  ctx.restore();
  if(scene==='idle'){
   ctx.save();ctx.fillStyle='#ffd94e';ctx.font='800 20px -apple-system';ctx.textAlign='center';
   ctx.globalAlpha=.6+.4*Math.sin(sceneT*.006);
   ctx.shadowColor='#000';ctx.shadowBlur=8;
   ctx.fillText('▼ タップして開封 ▼',CX(),CY()+H*.27);ctx.restore()}
  // チャージ吸い込みパーティクル
  if(scene==='charge'&&Math.random()<.7){const a=Math.random()*6.28,d=rand(H*.3,H*.55);
   addP({x:CX()+Math.cos(a)*d,y:CY()+Math.sin(a)*d,vx:-Math.cos(a)*rand(3,7),vy:-Math.sin(a)*rand(3,7),s:rand(1.5,3.5),c:ladderIdx>=0&&LADDER[ladderIdx]!=='RAINBOW'?LADDER[ladderIdx]:'#ffd94e',life:d/5,glow:14})}
 }
 // シャード
 ctx.save();
 shards=shards.filter(s=>s.life-->0);
 for(const s of shards){s.x+=s.vx;s.y+=s.vy;s.vy+=.5;s.r+=s.vr;
  ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.r);ctx.globalAlpha=Math.min(1,s.life/30);
  ctx.fillStyle=s.c;ctx.beginPath();ctx.moveTo(0,-s.s/2);ctx.lineTo(s.s/2,s.s/2);ctx.lineTo(-s.s/2,s.s/2);ctx.closePath();ctx.fill();ctx.restore()}
 ctx.restore();
 // カード（降臨→スタンプ→フリップ）
 if(scene==='descend'||scene==='stamp'||scene==='reveal'||scene==='result'){
  const cw=Math.min(W*.8,400);
  // スポットライト
  ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.25;
  const sp=ctx.createLinearGradient(CX(),0,CX(),CY()+cw/2);
  sp.addColorStop(0,RARCOL);sp.addColorStop(1,'transparent');
  ctx.fillStyle=sp;ctx.beginPath();ctx.moveTo(CX()-cw*.15,0);ctx.lineTo(CX()+cw*.15,0);ctx.lineTo(CX()+cw*.62,CY()+cw/2);ctx.lineTo(CX()-cw*.62,CY()+cw/2);ctx.closePath();ctx.fill();ctx.restore();
  if(scene==='descend'){cardY+=(0-cardY)*.10;cardRot=Math.sin(sceneT*.004)*.06}
  else{cardY+=(0-cardY)*.3;cardRot*=.9}
  if(scene==='reveal'||scene==='result'){cardFlip=Math.min(1,cardFlip+dt/450)}
  const flipScale=Math.cos(cardFlip*Math.PI); // 1→-1
  const img = flipScale>0?backImg:cardImg;
  ctx.save();ctx.translate(CX(),CY()+cardY);ctx.rotate(cardRot);
  ctx.scale(Math.abs(flipScale)<.08?.08:Math.abs(flipScale),1);
  ctx.shadowColor=RARCOL;ctx.shadowBlur=40;
  if(img.complete)ctx.drawImage(img,-cw/2,-cw/2,cw,cw);
  // グロス光沢スイープ
  if((scene==='reveal'||scene==='result')&&glossX<1.6){glossX+=dt/900;
   const gx=(-cw/2)+glossX*cw;
   const gl=ctx.createLinearGradient(gx-40,0,gx+40,0);
   gl.addColorStop(0,'transparent');gl.addColorStop(.5,'rgba(255,255,255,.5)');gl.addColorStop(1,'transparent');
   ctx.fillStyle=gl;ctx.fillRect(-cw/2,-cw/2,cw,cw)}
  ctx.restore();
 }
 // レア度スタンプ
 if(scene==='stamp'||scene==='reveal'||scene==='result'){
  stampA=Math.min(1,stampA+dt/240);
  const sc=3-2*stampA;
  ctx.save();ctx.translate(CX(),H*.12);ctx.scale(sc,sc);ctx.globalAlpha=stampA;
  ctx.font='900 '+Math.min(W*.17,86)+'px -apple-system';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.lineWidth=10;ctx.strokeStyle='#000';ctx.strokeText(RAR,0,0);
  if(RAR==='SSR'){const g=ctx.createLinearGradient(-80,0,80,0);
   for(let i=0;i<=6;i++)g.addColorStop(i/6,`hsl(${(rainbowPhase*220+i*60)%360},95%,62%)`);
   ctx.fillStyle=g}else ctx.fillStyle=RARCOL;
  ctx.shadowColor=RARCOL;ctx.shadowBlur=26;ctx.fillText(RAR,0,0);ctx.restore();
 }
 // パーティクル
 ctx.save();
 parts=parts.filter(p=>p.life-->0);
 for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=p.drag;p.vy*=p.drag;
  if(p.shape==='rect'){p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.globalAlpha=Math.min(1,p.life/40);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*1.6);ctx.restore()}
  else{ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=Math.min(1,p.life/p.max);ctx.shadowColor=p.c;ctx.shadowBlur=p.glow;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,7);ctx.fill();ctx.restore()}}
 ctx.restore();
 // リング衝撃波
 ctx.save();ctx.globalCompositeOperation='lighter';
 rings=rings.filter(r=>r.a>0.02);
 for(const r of rings){r.r+=r.sp;r.a*=.94;ctx.globalAlpha=r.a;ctx.lineWidth=r.w;ctx.strokeStyle=r.c;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,7);ctx.stroke()}
 ctx.restore();
 ctx.restore(); // quake
 // ホワイトアウト
 if(whiteout>0){ctx.globalAlpha=whiteout;ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;whiteout-=dt/450}
 requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
function closeMe(){try{if(window.liff&&liff.isInClient()){liff.closeWindow();return}}catch(e){}
 window.close();history.back()}
</script>
</body></html>
